[project]
name = "study-lms-2"
version = "0.8.0"
description = "Local-first personal LMS and exam-prep platform for CS/engineering students."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "jinja2>=3.1.4,<4.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "yt-dlp>=2025.1.15",
    "imageio-ffmpeg>=0.5.1,<1.0.0",
    "mlx-whisper>=0.4.0,<1.0.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0.3,<2.0.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "fsrs>=3.0.0,<6.0.0",
    "httpx>=0.28.0,<1.0.0",
    "trafilatura>=2.0.0,<3.0.0",
    "pypdf>=5.1.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "playwright>=1.49.0,<2.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = ["E501", "S101", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
