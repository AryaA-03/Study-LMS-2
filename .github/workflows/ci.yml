name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check backend tests
      - name: Run isolated unit and integration tests
        run: pytest -m "not e2e and not live" -q
      - name: Build React/TypeScript Frontend
        run: |
          cd frontend-app
          npm ci
          npm run build
